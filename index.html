    <!-- Google Analytics (gtag.js) - Delayed/Lazy-Loaded on User Interaction/Scroll -->
    <script>
      (function() {
        let loaded = false;
        function loadGA() {
          if (loaded) return;
          loaded = true;
          
          window.removeEventListener('scroll', loadGA, { passive: true });
          window.removeEventListener('mousemove', loadGA, { passive: true });
          window.removeEventListener('touchstart', loadGA, { passive: true });
          window.removeEventListener('keydown', loadGA, { passive: true });
          
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-1X9DTB7PL5';
          document.head.appendChild(script);
          
          window.dataLayer = window.dataLayer || [];
          window.gtag = function() { window.dataLayer.push(arguments); };
          gtag('js', new Date());
          gtag('config', 'G-1X9DTB7PL5');
        }
        
        window.addEventListener('scroll', loadGA, { passive: true });
        window.addEventListener('mousemove', loadGA, { passive: true });
        window.addEventListener('touchstart', loadGA, { passive: true });
        window.addEventListener('keydown', loadGA, { passive: true });
        
        if (window.requestIdleCallback) {
          window.requestIdleCallback(function() {
            setTimeout(loadGA, 5000);
          });
        } else {
          setTimeout(loadGA, 6000);
        }
      })();
    </script>

    <!-- On-Page SEO Primary Metadata -->
    <title>العاب اونلاين فري | بوكي بوكس</title>
    <script>
      (function() {
        var path = window.location.pathname || "/";
        var isEn = false;
        
        // Priority 1: Check saved language preference in localStorage
        try {
          var saved = localStorage.getItem("poki_lang");
          if (saved) {
            isEn = (saved === "en");
          } else {
            // Priority 2: Check URL path markers
            if (path.indexOf("privacy-policy") !== -1 || 
                path.indexOf("terms-of-use") !== -1 || 
                path.indexOf("disclaimer") !== -1 || 
                path.indexOf("sitemap") !== -1 || 
                path.indexOf("favorites") !== -1 || 
                path.indexOf("category-") !== -1 || 
                path.indexOf("game-") !== -1 ||
                path.indexOf("free-online-games") !== -1) {
              isEn = true;
            } else if (path.indexOf("سياسة-الخصوصية") !== -1 || 
                       path.indexOf("شروط-الاستخدام") !== -1 || 
                       path.indexOf("إخلاء-المسؤولية") !== -1 || 
                       path.indexOf("خريطة-الموقع") !== -1 || 
                       path.indexOf("المفضلة") !== -1 || 
                       path.indexOf("تصنيف-") !== -1 || 
                       path.indexOf("لعبة-") !== -1 ||
                       path.indexOf("العاب-اونلاين-فري") !== -1) {
              isEn = false;
            } else {
              // Priority 3: Fallback to browser language
              isEn = !!(navigator.language && navigator.language.startsWith("en"));
            }
          }
        } catch (e) {
          isEn = !!(navigator.language && navigator.language.startsWith("en"));
        }

        var title = isEn ? "Free Online Games | PokiBox" : "العاب اونلاين فري | بوكي بوكس";
        var desc = isEn ? "Free Online Games - Play the best arcade, puzzle, and neon action games on PokiBox with zero downloads or popups." : "العاب اونلاين فري - استمتع بأقوى وأحدث الألعاب المجانية مباشرة على بوكي بوكس بدون تحميل! العب ألعاب متصفح، ألعاب ذكاء، ألغاز، وألعاب ثلاثية الأبعاد خفيفة مجاناً وبسرعة فائقة.";
        
        document.title = title;
        
        // Instant meta updates
        var metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute("content", desc);
        
        var ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", title);
        
        var ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute("content", desc);
      })();
    </script>
